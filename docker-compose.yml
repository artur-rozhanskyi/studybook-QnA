x-app-environment: &app_environment
  RAILS_ENV: ${RAILS_ENV:-development}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/1}
  CHROME_HOSTNAME: ${CHROME_HOSTNAME}

volumes:
  bundle_cache:
  node_modules:
  postgres_data:
  redis_data:

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-studybook-QnA_development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d \"$${POSTGRES_DB:-studybook-QnA_development}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-net

  redis:
    image: redis:8-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-net

  web: &rails_app
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    command: >
      bash -lc "set -e;
      rm -f tmp/pids/server.pid;
      bundle exec rails server -b 0.0.0.0"
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - node_modules:/rails/node_modules
    tty: true
    stdin_open: true
    restart: on-failure
    environment:
      <<: *app_environment
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - app-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *rails_app
    command: bundle exec sidekiq -C config/sidekiq.yml
    ports: []
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "ruby", "-e", "cmdline = File.read('/proc/1/cmdline'); exit(cmdline.include?('sidekiq') ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
